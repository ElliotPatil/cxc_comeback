const initial={chapters:{},notes:{},dateNotes:{},tasks:{},schedule:{},samplePapers:{},mathQuestions:{},dayCompletion:{},activity:[],exam:{prelimDates:"",boardDates:"",papers:"",marks:"",resources:""}};
function localDateKey(date=new Date()){const y=date.getFullYear(),m=String(date.getMonth()+1).padStart(2,'0'),d=String(date.getDate()).padStart(2,'0');return `${y}-${m}-${d}`}let state=structuredClone(initial);let currentPage='tracker',currentSubject=Object.keys(subjects)[0],currentChapter=subjects[currentSubject][0][0],selectedDate=localDateKey(),calendarMonth=new Date().getMonth(),calendarYear=new Date().getFullYear();
const DB_NAME='c10c-local-db',DB_VERSION=1,STORE_NAME='app';
let dbPromise=null,saveQueue=Promise.resolve(),storageMode='loading';
function openC10CDB(){
  if(!('indexedDB' in window))return Promise.reject(new Error('IndexedDB unavailable'));
  if(!dbPromise)dbPromise=new Promise((resolve,reject)=>{
    const request=indexedDB.open(DB_NAME,DB_VERSION);
    request.onupgradeneeded=()=>{const db=request.result;if(!db.objectStoreNames.contains(STORE_NAME))db.createObjectStore(STORE_NAME)};
    request.onsuccess=()=>resolve(request.result);
    request.onerror=()=>reject(request.error||new Error('Could not open local database'));
  });
  return dbPromise;
}
async function readDBState(){
  const db=await openC10CDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(STORE_NAME,'readonly'),request=tx.objectStore(STORE_NAME).get('state');
    request.onsuccess=()=>resolve(request.result||null);
    request.onerror=()=>reject(request.error||new Error('Could not read local database'));
  });
}
async function writeDBState(snapshot){
  const db=await openC10CDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(STORE_NAME,'readwrite');
    tx.objectStore(STORE_NAME).put(snapshot,'state');
    tx.oncomplete=()=>resolve();
    tx.onerror=()=>reject(tx.error||new Error('Could not save local database'));
    tx.onabort=()=>reject(tx.error||new Error('Local database save aborted'));
  });
}
function mergeState(raw){
  if(!raw||typeof raw!=='object'||Array.isArray(raw))return structuredClone(initial);
  return {...structuredClone(initial),...raw,chapters:raw.chapters||{},notes:raw.notes||{},dateNotes:raw.dateNotes||{},tasks:raw.tasks||{},schedule:raw.schedule||{},exam:{...initial.exam,...(raw.exam||{})},samplePapers:raw.samplePapers||{},mathQuestions:raw.mathQuestions||{},dayCompletion:raw.dayCompletion||{},activity:Array.isArray(raw.activity)?raw.activity:[]};
}
async function load(){
  try{
    const saved=await readDBState();
    if(saved){state=mergeState(saved);storageMode='indexeddb';}
    else{
      let legacy=null;
      try{legacy=JSON.parse(localStorage.getItem('class10cc')||'null')}catch(e){}
      state=mergeState(legacy);
      await writeDBState(state);
      storageMode='indexeddb';
    }
  }catch(error){
    console.warn('C10C IndexedDB unavailable; using localStorage fallback.',error);
    try{state=mergeState(JSON.parse(localStorage.getItem('class10cc')||'null'))}catch(e){state=structuredClone(initial)}
    storageMode='fallback';
  }
  updateStorageStatus();
}
function updateStorageStatus(){
  const el=document.getElementById('saveStatus');if(!el)return;
  if(storageMode==='indexeddb'){el.textContent='● SAVED ON DEVICE';el.className='tag green';}
  else if(storageMode==='fallback'){el.textContent='● LOCAL BACKUP MODE';el.className='tag yellowtag';}
  else{el.textContent='● LOADING DATA';el.className='tag';}
}
function save(){
  const snapshot=JSON.parse(JSON.stringify(state));
  try{localStorage.setItem('class10cc',JSON.stringify(snapshot));}catch(error){console.warn('LocalStorage safety mirror unavailable.',error);}
  saveQueue=saveQueue.then(()=>writeDBState(snapshot)).then(()=>{storageMode='indexeddb';updateStorageStatus();}).catch(error=>{console.error('IndexedDB save failed.',error);storageMode='fallback';updateStorageStatus();});window.C10CCloud?.queueCloudSync();
}
function key(s,c){return s+'::'+c}function pct(s,c){return (subjects[s].find(x=>x[0]===c)||[c,0])[1]}
function chapterData(s,c){return state.chapters[key(s,c)]||(state.chapters[key(s,c)]={checks:Array(6).fill(false)})}
function allChapters(){return Object.entries(subjects).flatMap(([s,cs])=>cs.map(([c,p])=>({s,c,p})))}
function completion(){let a=allChapters();return Math.round(a.reduce((n,x)=>n+x.p,0)/a.length)}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
window.C10CBridge={get state(){return state},subjects,completion,localDateKey};
