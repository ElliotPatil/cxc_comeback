const DB_NAME='c10c-local-db',DB_VERSION=1,STORE_NAME='app';
let dbPromise=null,saveQueue=Promise.resolve(),storageMode='loading';
function openC10CDB(){
  if(!('indexedDB' in window))return Promise.reject(new Error('IndexedDB unavailable'));
  if(!dbPromise)dbPromise=new Promise((resolve,reject)=>{
    const request=indexedDB.open(DB_NAME,DB_VERSION);
    request.onupgradeneeded=()=>{const db=request.result;if(!db.objectStoreNames.contains(STORE_NAME))db.createObjectStore(STORE_NAME)};

    request.onerror=()=>reject(request.error||new Error('Could not open local database'));

}
async function readDBState(){
  const db=await openC10CDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(STORE_NAME,'readonly'),request=tx.objectStore(STORE_NAME).get('state');
    request.onsuccess=()=>resolve(request.result||null);
    request.onerror=()=>reject(request.error||new Error('Could not read local database'));
  });
}
async function writeDBState(snapshot){
  const db=await openC10CDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(STORE_NAME,'readwrite');
    tx.objectStore(STORE_NAME).put(snapshot,'state');
    tx.oncomplete=()=>resolve();
    tx.onerror=()=>reject(tx.error||new Error('Could not save local database'));
    tx.onabort=()=>reject(tx.error||new Error('Local database save aborted'));
  });
}

 };
 const grouped=Object.entries(subjects).map(([subject,cs])=>{const rows=cs.map(([chapter])=>{const [tier,marks,basis]=priorityRules(subject,chapter);const color=tier==='Highest'?'red':tier==='High'?'yellowtag':'green';return `<div class="item priority-item"><div><strong>${escapeHtml(chapter)}</strong><small>${escapeHtml(basis)}</small></div><span class="tag ${color}">${escapeHtml(tier)} · ${escapeHtml(marks)}</span></div>`}).join('');return `<section class="card priority-subject"><div class="subject-head"><h3>${escapeHtml(subject)}</h3><span class="tag">${cs.length} topics</span></div><div class="list">${rows}</div></section>`}).join('');
 const priorityView=`<div class="notice">This is an exam-planning guide, not a prediction of exact questions. CBSE publishes unit/section weightage for some subjects, not guaranteed marks for each chapter. Chapters inside the same unit are not ranked against one another unless the Board provides that split.</div><div class="priority-grid">${grouped}</div><div class="card" style="margin-top:16px"><strong>Official references</strong><p class="small">Use the current session documents and sample papers as the final authority.</p><div class="list"><div class="item"><a href="https://cbseacademic.nic.in/curriculum_2027.html" target="_blank" rel="noopener">CBSE 2026–27 curriculum</a></div><div class="item"><a href="https://cbseacademic.nic.in/sqp_classx_2026-27.html" target="_blank" rel="noopener">Class X 2026–27 sample papers & marking schemes</a></div></div></div>`;
 return `${head('03 / OVERVIEW','Syllabus & Exam Priority','Two separate views: your progress and the Board’s published assessment emphasis.')}<div class="view-tabs"><button class="tab-btn ${syllabusView==='completion'?'active':''}" data-syllabus-view="completion">SYLLABUS COMPLETION</button><button class="tab-btn ${syllabusView==='priority'?'active':''}" data-syllabus-view="priority">CBSE EXAM PRIORITY</button></div>${syllabusView==='completion'?completionView:priorityView}`;
}
function getPlans(date){const d=new Date(date+'T12:00:00');const fallback=d.getFullYear()===2026&&d.getMonth()===10?schedule[d.getDate()]:null;const saved=Object.prototype.hasOwnProperty.call(state.schedule,date)?state.schedule[date]:fallback;if(!saved||!saved.length)return [];return Array.isArray(saved[0])?saved:[saved]}
function calendarPage(){let year=calendarYear,month=calendarMonth,first=new Date(year,month,1),start=first.getDay();const subjectColor=s=>/mathematics/i.test(s)?'math':/^science/i.test(s)?'science':/^social science/i.test(s)?'sst':/^english/i.test(s)?'english':/^hindi/i.test(s)?'hindi':/artificial intelligence|^ai$/i.test(s)?'ai':'other';let cells='';for(let i=0;i<42;i++){const cellDate=new Date(year,month,i-start+1);const day=cellDate.getDate(),other=cellDate.getMonth()!==month,keydate=localDateKey(cellDate);const plans=!other?getPlans(keydate):[];const dots=[...new Set(plans.map(p=>subjectColor(p[0])))].map(c=>`<i class="subject-dot ${c}" aria-hidden="true"></i>`).join('');const completed=!!state.dayCompletion?.[keydate];cells+=`<div class="day ${other?'out':''} ${completed?'completed':''} ${keydate===selectedDate?'selected':''}" data-date="${keydate}" ${other?'data-other="1"':''}><div class="num">${day}</div>${dots?`<div class="day-subject-dots" aria-label="${plans.length} planned subject entries">${dots}</div>`:''}</div>`;}let dateObj=new Date(selectedDate+'T12:00:00');let dayNum=dateObj.getDate();let plans=getPlans(selectedDate);let dateLabel=dateObj.toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'});let note=state.dateNotes[selectedDate]||'';let tasks=state.tasks[selectedDate]||[];const planSubject=Object.keys(subjects)[0];const planChapter=subjects[planSubject]?.[0]?.[0]||'';const subjectOptions=Object.keys(subjects).map(s=>`<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join('');const chapterOptions=(subjects[planSubject]||[[planChapter,0]]).map(([ch])=>`<option value="${escapeHtml(ch)}">${escapeHtml(ch)}</option>`).join('');const planHtml=plans.length?plans.map((p,i)=>{const done=!!state.subjectCompletion?.[selectedDate]?.[planCompletionKey(p)];return `<div class="item" style="margin:8px 0"><div style="flex:1"><label class="check" style="margin:0"><input type="checkbox" data-plan-complete="${i}" ${done?'checked':''}><span><span class="tag">${escapeHtml(p[0])}</span><p style="margin:7px 0 3px"><strong>${escapeHtml(p[1]||'')}</strong></p><div class="small">${escapeHtml(p[2]||'')}</div></span></label></div><button class="danger-btn" data-plan-delete="${i}" aria-label="Remove ${escapeHtml(p[0])}">×</button></div>`}).join(''):'<div class="empty">No study plan for this date yet. Add a subject below.</div>';let taskHtml=tasks.map((t,i)=>`<label class="task-row"><input type="checkbox" data-task-check="${i}" ${t.done?'checked':''}><span style="flex:1;${t.done?'text-decoration:line-through;color:#65716b':''}">${escapeHtml(t.text)}</span><button class="danger-btn" data-task-delete="${i}">×</button></label>`).join('');return `${head('02 / PLANNING','Calendar','Your date-wise subject timetable, daily notes and study tasks.')}
<div class="card"><div class="calendar-head"><button class="secondary-btn" id="prevMonth">←</button><h2 class="section-title" style="margin:0">${first.toLocaleDateString('en-IN',{month:'long',year:'numeric'})}</h2><button class="secondary-btn" id="nextMonth">→</button></div><div class="calendar">${['SUN','MON','TUE','WED','THU','FRI','SAT'].map(x=>`<div class="dayname">${x}</div>`).join('')}${cells}</div><div class="subject-legend"><span><i class="subject-dot math"></i>Maths</span><span><i class="subject-dot science"></i>Science</span><span><i class="subject-dot sst"></i>SST</span><span><i class="subject-dot english"></i>English</span><span><i class="subject-dot hindi"></i>Hindi</span><span><i class="subject-dot ai"></i>AI</span></div><div class="footer-note">November timetable is preloaded from our planning conversation. Dates marked for Youth Parliament remain flexible until the organiser confirms the brochure/date discrepancy.</div></div>
<div class="calendar-lower"><div class="card yellow"><div class="eyebrow">SELECTED DATE</div><h2 class="section-title" style="margin:5px 0">${dateLabel}</h2>${planHtml}<div class="subject-head" style="margin-top:14px"><span class="tag yellowtag">DAILY STUDY PLAN</span><button class="secondary-btn" id="editScheduleBtn">ADD SUBJECT</button></div><div id="scheduleEditor" class="schedule-editor hidden"><label class="field-label" for="scheduleSubject">SUBJECT</label><select id="scheduleSubject" class="chapter-select">${subjectOptions}</select><label class="field-label" for="scheduleChapter">CHAPTER / FOCUS</label><select id="scheduleChapter" class="chapter-select">${chapterOptions}</select><label class="field-label" for="scheduleDetail">EXTRA DETAILS (OPTIONAL)</label><input id="scheduleDetail" class="field" style="width:100%" placeholder="e.g. Tuition, revision, test…"><div class="toolbar" style="margin-top:12px"><button class="primary-btn" id="saveScheduleBtn">ADD TO DAY</button><button class="secondary-btn" id="cancelScheduleBtn">CANCEL</button><button class="danger-btn" id="resetScheduleBtn">CLEAR ALL</button></div></div><label class="field-label">DATE NOTES</label><textarea id="dateNote" class="note-area" style="min-height:115px" placeholder="Events, reminders, what changed, or notes for this date…">${escapeHtml(note)}</textarea></div><div class="card"><div class="eyebrow">TASK LIST</div><h2 class="section-title" style="margin:5px 0">Study tasks</h2><div id="taskList">${taskHtml||'<div class="empty">No tasks added for this date yet.</div>'}</div><div class="toolbar" style="margin-top:12px"><input id="newTask" placeholder="Add a study task…" style="flex:1;min-width:130px"><button class="primary-btn" id="addTask">ADD</button></div></div></div>`}
function examPage(){
let e=state.exam;
const prelim=[
["2 Dec","Wednesday","Artificial Intelligence"],
["4 Dec","Friday","Science"],
["7 Dec","Monday","Mathematics Standard"],
["9 Dec","Wednesday","English Language & Literature"],
["11 Dec","Friday","Hindi Course B"],
["14 Dec","Monday","Social Science"]
];
const boards=[
["17 Feb","Wednesday","Mathematics Standard","041"],
["22 Feb","Monday","Science","086"],
["24 Feb","Wednesday","Artificial Intelligence","417"],
["26 Feb","Friday","English Language & Literature","184"],
["3 Mar","Wednesday","Hindi Course B","085"],
["8 Mar","Monday","Social Science","087"]
];
const rows=(items,board=false)=>items.map(x=>"<tr><td>"+x[0]+"</td><td>"+x[1]+"</td><td><strong>"+x[2]+"</strong></td>"+(board?"<td>"+x[3]+"</td>":"")+"</tr>").join("");
const now=new Date();now.setHours(0,0,0,0);
const prelimDates=prelim.map((x,i)=>({date:new Date(2026,11,parseInt(x[0],10)),subject:x[2],time:"10:30 AM"}));
const nextPrelim=prelimDates.find(x=>x.date>=now);
const prelimDays=nextPrelim?Math.ceil((nextPrelim.date-now)/86400000):null;
const prelimCountdown=nextPrelim?(prelimDays===0?"Today · "+nextPrelim.subject:prelimDays+" days until "+nextPrelim.subject):"All preliminary papers are complete";
const next=new Date(2027,1,17);const days=Math.ceil((next-now)/86400000);
const countdown=days>0?days+" days until Mathematics Standard":days===0?"Mathematics Standard exam day":"Board examinations have begun";
const tableStyle="width:100%;border-collapse:collapse;font-size:13px";
const cellStyle="padding:11px 8px;border-bottom:1px solid #000;text-align:left";
return head('04 / PREPARATION','Exam Centre','Your prelim and CBSE board schedule, sample papers and results.')+
'<div class="grid exam-grid" style="margin-bottom:17px"><div class="card yellow"><div class="eyebrow">PRELIM COUNTDOWN</div><div class="stat-num">'+(nextPrelim?prelimDays:'✓')+'</div><div class="stat-foot">'+prelimCountdown+(nextPrelim?' · '+nextPrelim.date.toLocaleDateString('en-IN',{day:'numeric',month:'short'})+' · '+nextPrelim.time:'')+'</div></div><div class="card dark"><div class="eyebrow">BOARD COUNTDOWN</div><div class="stat-num">'+days+'</div><div class="stat-foot">'+countdown+' · 10:30 AM</div></div></div>'+
'<div class="grid exam-grid"><div class="card yellow"><div class="eyebrow">DECEMBER 2026</div><h2 class="section-title">Preliminary examinations</h2><div style="overflow-x:auto"><table style="'+tableStyle+'"><thead><tr><th style="'+cellStyle+'">Date</th><th style="'+cellStyle+'">Day</th><th style="'+cellStyle+'">Subject</th></tr></thead><tbody>'+rows(prelim)+'</tbody></table></div><div class="footer-note">Study leave: 3, 8 and 10 December. Holidays: 5, 6, 12 and 13 December.</div></div>'+
'<div class="card sage"><div class="eyebrow">FEBRUARY–MARCH 2027</div><h2 class="section-title">CBSE board examinations</h2><div style="overflow-x:auto"><table style="'+tableStyle+'"><thead><tr><th style="'+cellStyle+'">Date</th><th style="'+cellStyle+'">Day</th><th style="'+cellStyle+'">Subject</th><th style="'+cellStyle+'">Code</th></tr></thead><tbody>'+rows(boards,true)+'</tbody></table></div><div class="footer-note">All listed papers: 10:30 AM start. Refer to the official datesheet for reporting time and paper duration.</div></div></div>'+
'<div class="grid exam-grid" style="margin-top:16px"><div class="card"><div class="eyebrow">PRACTICE</div><h2 class="section-title">Sample paper log</h2><label class="field-label">QUICK ADD</label><div class="toolbar"><input id="samplePaperQuick" placeholder="Type sample paper to log one…" style="flex:1;min-width:140px"><button class="primary-btn" id="samplePaperAdd">ADD</button></div><div class="toolbar"><select id="samplePaperSubject" class="chapter-select"></select></div><div id="samplePaperCounts" class="list"></div><label class="field-label">Paper attempts and analysis</label><textarea class="note-area" data-exam="papers" placeholder="Private paper analysis, mistakes and topics to revise…">'+escapeHtml(e.papers)+'</textarea></div><div class="card"><div class="eyebrow">ASSESSMENT</div><h2 class="section-title">Marks & reflections</h2><label class="field-label">Test scores and lessons</label><textarea class="note-area" data-exam="marks" placeholder="Record scores, strengths, and recurring mistakes…">'+escapeHtml(e.marks)+'</textarea></div></div>'+
'<div class="card" style="margin-top:16px"><div class="eyebrow">REFERENCE DESK</div><h2 class="section-title">Exam resources & instructions</h2><textarea class="note-area" data-exam="resources" placeholder="Important links, instructions, admit-card reminders, paper patterns…">'+escapeHtml(e.resources)+'</textarea><div class="footer-note">Dates transcribed from the datesheets you shared. Keep the original official notices as the final reference if your school or CBSE issues an update.</div></div>';
}
function bindPage(){if(currentPage==='syllabus'){document.querySelectorAll('[data-syllabus-view]').forEach(b=>b.onclick=()=>{syllabusView=b.dataset.syllabusView;render()})}
if(currentPage==='tracker'){const qDate=document.getElementById('mathQuestionDate'),qCount=document.getElementById('mathQuestionCount');if(qDate&&qCount){const fill=()=>{const date=qDate.value||localDateKey();qCount.value=state.mathQuestions?.[currentChapter]?.[date]??''};fill();qDate.onchange=fill;document.getElementById('saveMathQuestions').onclick=()=>{const date=qDate.value||localDateKey(),raw=qCount.value.trim(),count=Number(raw);if(raw===''||!Number.isInteger(count)||count<0){alert('Enter a whole number of questions (0 or more).');return;}if(!state.mathQuestions[currentChapter])state.mathQuestions[currentChapter]={};if(count===0)delete state.mathQuestions[currentChapter][date];else state.mathQuestions[currentChapter][date]=count;state.activity.push({date,label:'Logged '+count+' Mathematics questions · '+currentChapter});save();document.getElementById('mathQuestionSaved').textContent='Saved '+count+' questions for '+date+'.';};}document.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>{currentSubject=b.dataset.sub;currentChapter=subjects[currentSubject][0][0];render()});document.getElementById('chapterSelect').onchange=e=>{currentChapter=e.target.value;render()};document.querySelectorAll('[data-check]').forEach(el=>el.onchange=()=>{chapterData(currentSubject,currentChapter).checks[+el.dataset.check]=el.checked;if(el.checked)state.activity.push({date:localDateKey(),label:'Completed a study milestone · '+currentChapter});save();render()});document.getElementById('chapterNote').oninput=e=>{state.notes[key(currentSubject,currentChapter)]=e.target.value;save()}}
if(currentPage==='calendar'){document.querySelectorAll('[data-plan-complete]').forEach(el=>el.onchange=()=>{const p=getPlans(selectedDate)[+el.dataset.planComplete];if(!p)return;state.subjectCompletion[selectedDate]??={};state.subjectCompletion[selectedDate][planCompletionKey(p)]=el.checked;state.activity.push({date:selectedDate,label:(el.checked?'Completed':'Reopened')+' study subject · '+p[0]+' · '+(p[1]||'')});save();render()});document.getElementById('prevMonth').onclick=()=>{const d=new Date(calendarYear,calendarMonth-1,1);calendarYear=d.getFullYear();calendarMonth=d.getMonth();render()};document.getElementById('nextMonth').onclick=()=>{const d=new Date(calendarYear,calendarMonth+1,1);calendarYear=d.getFullYear();calendarMonth=d.getMonth();render()};document.querySelectorAll('[data-date]').forEach(el=>el.onclick=()=>{selectedDate=el.dataset.date;const d=new Date(selectedDate+'T12:00:00');calendarYear=d.getFullYear();calendarMonth=d.getMonth();render()});document.getElementById('dateNote').oninput=e=>{state.dateNotes[selectedDate]=e.target.value;save()};document.getElementById('editScheduleBtn').onclick=()=>document.getElementById('scheduleEditor').classList.remove('hidden');document.getElementById('cancelScheduleBtn').onclick=()=>document.getElementById('scheduleEditor').classList.add('hidden');document.getElementById('scheduleSubject').onchange=e=>{const choices=subjects[e.target.value]||[['Event details',0]];document.getElementById('scheduleChapter').innerHTML=choices.map(([ch])=>`<option value="${escapeHtml(ch)}">${escapeHtml(ch)}</option>`).join('')};document.getElementById('saveScheduleBtn').onclick=()=>{const subject=document.getElementById('scheduleSubject').value;const chapter=document.getElementById('scheduleChapter').value;const detail=document.getElementById('scheduleDetail').value.trim();const existing=getPlans(selectedDate);state.schedule[selectedDate]=[...existing,[subject,chapter,detail]];save();render()};document.getElementById('resetScheduleBtn').onclick=()=>{delete state.schedule[selectedDate];save();render()};document.querySelectorAll('[data-plan-delete]').forEach(el=>el.onclick=()=>{const current=getPlans(selectedDate);current.splice(+el.dataset.planDelete,1);if(current.length)state.schedule[selectedDate]=current;else state.schedule[selectedDate]=[];save();render()});document.getElementById('addTask').onclick=()=>{let v=document.getElementById('newTask').value.trim();if(!v)return;(state.tasks[selectedDate]??=[]).push({text:v,done:false});save();render()};document.querySelectorAll('[data-task-check]').forEach(el=>el.onchange=()=>{const task=state.tasks[selectedDate][+el.dataset.taskCheck];task.done=el.checked;if(el.checked)state.activity.push({date:selectedDate,label:'Completed study task · '+task.text});save();render()});document.querySelectorAll('[data-task-delete]').forEach(el=>el.onclick=()=>{state.tasks[selectedDate].splice(+el.dataset.taskDelete,1);save();render()})}
if(currentPage==='exam'){
const subj=document.getElementById("samplePaperSubject");if(subj){subj.innerHTML=Object.keys(subjects).map(x=>'<option value="'+escapeHtml(x)+'">'+escapeHtml(x)+'</option>').join('');}
const countRoot=document.getElementById("samplePaperCounts");if(countRoot)countRoot.innerHTML=Object.keys(subjects).map(x=>'<div class="item"><span>'+escapeHtml(x)+'</span><strong>'+(state.samplePapers[x]||0)+'</strong></div>').join('');
document.getElementById("samplePaperAdd").onclick=()=>{const phrase=document.getElementById("samplePaperQuick").value.trim().toLowerCase();if(!phrase.includes("sample paper")){alert('Type “sample paper” to use this quick entry.');return;}const subject=subj.value;state.samplePapers[subject]=(state.samplePapers[subject]||0)+1;state.activity.push({date:localDateKey(),label:"Logged a sample paper · "+subject});save();render()};
document.querySelectorAll('[data-exam]').forEach(el=>el.oninput=()=>{state.exam[el.dataset.exam]=el.value;save()})}}
if(isParentView){parentsPage()}else{load().then(()=>{appLoaded=true;render();if(cloudUser)queueCloudSync()}).catch(error=>{console.error("C10C startup failed",error);render()})}
</script></body></html>
