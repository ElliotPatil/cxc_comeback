function mergeState(raw){
  if(!raw||typeof raw!=='object'||Array.isArray(raw))return structuredClone(initial);
  return {...structuredClone(initial),...raw,chapters:raw.chapters||{},notes:raw.notes||{},dateNotes:raw.dateNotes||{},tasks:raw.tasks||{},schedule:raw.schedule||{},exam:{...initial.exam,...(raw.exam||{})},samplePapers:raw.samplePapers||{},activity:Array.isArray(raw.activity)?raw.activity:[]};
}
async function load(){
  try{
    const saved=await readDBState();
    if(saved){state=mergeState(saved);storageMode='indexeddb';}
    else{
      let legacy=null;
      try{legacy=JSON.parse(localStorage.getItem('class10cc')||'null')}catch(e){}
      state=mergeState(legacy);
      await writeDBState(state);
      storageMode='indexeddb';
    }
  }catch(error){
    console.warn('C10C IndexedDB unavailable; using localStorage fallback.',error);
    try{state=mergeState(JSON.parse(localStorage.getItem('class10cc')||'null'))}catch(e){state=structuredClone(initial)}
    storageMode='fallback';
  }
  updateStorageStatus();
}
function updateStorageStatus(){
  const el=document.getElementById('saveStatus');if(!el)return;
  if(storageMode==='indexeddb'){el.textContent='● SAVED ON DEVICE';el.className='tag green';}
  else if(storageMode==='fallback'){el.textContent='● LOCAL BACKUP MODE';el.className='tag yellowtag';}
  else{el.textContent='● LOADING DATA';el.className='tag';}
}
function save(){
  const snapshot=JSON.parse(JSON.stringify(state));
  try{localStorage.setItem('class10cc',JSON.stringify(snapshot));}catch(error){console.warn('LocalStorage safety mirror unavailable.',error);}
  saveQueue=saveQueue.then(()=>writeDBState(snapshot)).then(()=>{storageMode='indexeddb';updateStorageStatus();}).catch(error=>{console.error('IndexedDB save failed.',error);storageMode='fallback';updateStorageStatus();});queueCloudSync();
}
function key(s,c){return s+'::'+c}function pct(s,c){return (subjects[s].find(x=>x[0]===c)||[c,0])[1]}
function chapterData(s,c){return state.chapters[key(s,c)]||(state.chapters[key(s,c)]={checks:Array(6).fill(false)})}
function allChapters(){return Object.entries(subjects).flatMap(([s,cs])=>cs.map(([c,p])=>({s,c,p})))}
function completion(){let a=allChapters();return Math.round(a.reduce((n,x)=>n+x.p,0)/a.length)}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

}
function bindPage(){if(currentPage==='tracker'){document.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>{currentSubject=b.dataset.sub;currentChapter=subjects[currentSubject][0][0];render()});document.getElementById('chapterSelect').onchange=e=>{currentChapter=e.target.value;render()};document.querySelectorAll('[data-check]').forEach(el=>el.onchange=()=>{chapterData(currentSubject,currentChapter).checks[+el.dataset.check]=el.checked;save();render()});document.getElementById('chapterNote').oninput=e=>{state.notes[key(currentSubject,currentChapter)]=e.target.value;save()}}
if(currentPage==='calendar'){document.getElementById('prevMonth').onclick=()=>{const d=new Date(calendarYear,calendarMonth-1,1);calendarYear=d.getFullYear();calendarMonth=d.getMonth();render()};document.getElementById('nextMonth').onclick=()=>{const d=new Date(calendarYear,calendarMonth+1,1);calendarYear=d.getFullYear();calendarMonth=d.getMonth();render()};document.querySelectorAll('[data-date]').forEach(el=>el.onclick=()=>{selectedDate=el.dataset.date;const d=new Date(selectedDate+'T12:00:00');calendarYear=d.getFullYear();calendarMonth=d.getMonth();render()});document.getElementById('dateNote').oninput=e=>{state.dateNotes[selectedDate]=e.target.value;save()};document.getElementById('editScheduleBtn').onclick=()=>document.getElementById('scheduleEditor').classList.remove('hidden');document.getElementById('cancelScheduleBtn').onclick=()=>document.getElementById('scheduleEditor').classList.add('hidden');document.getElementById('scheduleSubject').onchange=e=>{const choices=subjects[e.target.value]||[[document.getElementById('scheduleChapter').value||'Event details',0]];document.getElementById('scheduleChapter').innerHTML=choices.map(([ch])=>`<option value="${escapeHtml(ch)}">${escapeHtml(ch)}</option>`).join('')};document.getElementById('saveScheduleBtn').onclick=()=>{const subject=document.getElementById('scheduleSubject').value;const chapter=document.getElementById('scheduleChapter').value;const detail=document.getElementById('scheduleDetail').value.trim();state.schedule[selectedDate]=[subject,chapter,detail];save();render()};document.getElementById('resetScheduleBtn').onclick=()=>{delete state.schedule[selectedDate];save();render()};document.getElementById('addTask').onclick=()=>{let v=document.getElementById('newTask').value.trim();if(!v)return;(state.tasks[selectedDate]??=[]).push({text:v,done:false});save();render()};document.querySelectorAll('[data-task-check]').forEach(el=>el.onchange=()=>{state.tasks[selectedDate][+el.dataset.taskCheck].done=el.checked;save();render()});document.querySelectorAll('[data-task-delete]').forEach(el=>el.onclick=()=>{state.tasks[selectedDate].splice(+el.dataset.taskDelete,1);save();render()})}
if(currentPage==='exam'){
const subj=document.getElementById("samplePaperSubject");if(subj){subj.innerHTML=Object.keys(subjects).map(x=>'<option value="'+escapeHtml(x)+'">'+escapeHtml(x)+'</option>').join('');}
const countRoot=document.getElementById("samplePaperCounts");if(countRoot)countRoot.innerHTML=Object.keys(subjects).map(x=>'<div class="item"><span>'+escapeHtml(x)+'</span><strong>'+(state.samplePapers[x]||0)+'</strong></div>').join('');
document.getElementById("samplePaperAdd").onclick=()=>{const phrase=document.getElementById("samplePaperQuick").value.trim().toLowerCase();if(!phrase.includes("sample paper")){alert('Type “sample paper” to use this quick entry.');return;}const subject=subj.value;state.samplePapers[subject]=(state.samplePapers[subject]||0)+1;state.activity.push({date:localDateKey(),label:"Logged a sample paper · "+subject});save();render()};
document.querySelectorAll('[data-exam]').forEach(el=>el.oninput=()=>{state.exam[el.dataset.exam]=el.value;save()})}}
if(isParentView){parentsPage()}else{load().then(()=>render()).catch(error=>{console.error('C10C startup failed',error);render()});}
</script></body></html>
